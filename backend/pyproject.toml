[project]
name = "backend"
version = "0.1.0"
description = "PennyWise Backend API and Document Extraction Services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8.0",
    "flask==3.0.0",
    "flask-cors==5.0.0",
    "google-genai>=2.25.0",
    "gunicorn>=21.2.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "openai>=3.19.2",
    "opencv-python==4.10.0.84",
    "pandas>=2.0.0",
    "pdfplumber>=0.10.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "pypdf2>=3.0.0",
    "pytesseract==0.3.13",
    "python-dateutil>=2.8.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
backend = "backend:main"
pennywise = "backend:main"
dev = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
